controls:
  - id: CC6.1
    domain: "Security Controls"
    name: "Logical Access Security"
    detector: "authentication"
    description: "Authentication mechanisms are implemented to verify user identity before granting access to application resources."

  - id: CC6.3
    domain: "Security Controls"
    name: "Access Authorization and Removal"
    detector: "access control"
    description: "Access to application resources is controlled through authorization mechanisms, roles, permissions, or other access control measures."

  - id: CC6.6
    domain: "Security Controls"
    name: "External Threat Protection"
    detector: "hardening"
    description: "Application-level security measures such as rate limiting, security headers, and input validation are used to reduce exposure to external threats. Static scanning provides only partial evidence."

  - id: CC6.7
    domain: "Security Controls"
    name: "Secrets and Credential Protection"
    detector: "secrets"
    description: "API keys, credentials, tokens, environment files, and other sensitive secrets are protected from exposure within the source code and repository."

  - id: CC8.1
    domain: "Processes"
    name: "Change Management"
    detector: "cicd"
    description: "Changes to software are managed through version control, automated workflows, testing, review, and controlled deployment processes."

  - id: CC7.1
    domain: "Processes"
    name: "Automated Testing Practices"
    detector: "testing"
    description: "Automated tests exist in the repository, supporting early detection of defects and regressions that could affect security or reliability. Static scanning shows test presence, not test quality or results."

  - id: CC7.2
    domain: "Processes"
    name: "Dependency Integrity"
    detector: "dependencies"
    description: "Dependency lockfiles and checksums are present, so third-party package versions are pinned and reproducible. This does not check for known vulnerabilities in those packages."

  - id: CC2.1
    domain: "Governance"
    name: "Information and Documentation"
    detector: "docs"
    description: "Relevant security and project documentation is maintained to provide information needed to support internal controls."